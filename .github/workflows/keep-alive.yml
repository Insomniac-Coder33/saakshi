# Once a day: a real request to the database, so the free Supabase project isn't paused for being idle
# while judging runs. /api/stats reads the seal tables. A failure here fails the run, and GitHub emails it.
name: Keep alive

on:
  schedule:
    - cron: "30 3 * * *" # 9:00 am IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: The database answers
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 https://web-alpha-orcin-85.vercel.app/api/stats -o /dev/null
      - name: The showcase loads
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 30 https://saakshi-witness.vercel.app/ -o /dev/null
